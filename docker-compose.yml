services:
  app:
    container_name: carbuyer-app
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - JAVA_TOOL_OPTIONS=-Xmx450m -Xms256m
    deploy:
      resources:
        limits:
          memory: 650M
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: carbuyer-db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carbuyer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    container_name: carbuyer-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - app

  grafana:
    container_name: carbuyer-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - prometheus

volumes:
  pgdata: