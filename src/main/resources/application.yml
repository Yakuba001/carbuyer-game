spring:
  application:
    name: car-market-simulator

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carbuyer_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 10

logging:
  level:
    org.hibernate.SQL: ${SHOW_SQL_LEVEL:OFF}
    org.hibernate.orm.results: ${SHOW_SQL_TRACE_LEVEL:OFF}

server:
  port: 8080
  error:
    include-message: always

info:
  app:
    name: "Carbuyer service"
    description: "Backend for remote server"
    version: "1.0.0"

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  security:
    jwt:
      secret: ${JWT_SECRET:8a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7A8B9C0D1E2F}
      access-token-ttl-ms: 900000
      refresh-token-ttl-ms: 604800000

  bots:
    enabled: ${BOTS_ENABLED:true}
    pool-size: 100
    min-action-delay-ms: 1000
    max-action-delay-ms: 5000

  finance:
    initial-balance: "1000.00"